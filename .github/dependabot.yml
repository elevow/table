version: 2
updates:
  # npm packages: one weekly PR for the safe minor and patch updates, separate PRs for major versions
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # These move together in one planned upgrade (Next 16 with React 19, TypeScript 5, ESLint 9 and
    # Tailwind 4), #167. Minor and patch updates still come. Remove this once that upgrade lands.
    # @types/node then moves to 22, the Node version the app runs on (its 22 types need TypeScript
    # 5.6); change its entry to `versions: ['>= 23']` so it stays there.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
